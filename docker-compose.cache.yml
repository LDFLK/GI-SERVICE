version: "3.9"

services:
  redis:
    build:
      context: ./redis
      dockerfile: Dockerfile
    container_name: gi-redis
    ports:
      - "127.0.0.1:6379:6379"
    # Shared store for both uvicorn workers (and later multiple replicas)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gi-service:
    environment:
      # Hostname `redis` is the compose service name (not localhost)
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: "true"
    depends_on:
      redis:
        condition: service_healthy
