openapi: 3.1.0

info:
  title: OpenGIN Service API - Person
  description: This document gives the structure of APIs for the OpenGIN Person Services.
  version: 1.0.0

servers:
  - url: http://localhost:8081

tags:
  - name: Person
    description: APIs for person-related information and history

paths:
  /v1/person/person-history/{person_id}:
    get:
      tags:
        - Person
      summary: Get person history.
      description: Returns a ministry history and president history for a given person.
      operationId: getPersonHistory

      parameters:
        - name: person_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the person
          example: "per-123"

      responses:
        "200":
          description: Successfully returned person history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonHistoryResponse"
              example:
                ministry_history:
                  - id: "min-456"
                    name: "Ministry of Health"
                    term: "2020-01-01 - 2022-05-15"
                    is_president: false
                  - id: "min-789"
                    name: "Ministry of Education"
                    term: "2022-05-15 - Present"
                    is_president: true
                ministries_worked_at: 2
                worked_as_president: 1

        "400":
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: "Person ID is required"

        "404":
          description: Person not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: "Person not found"

        "500":
          description: Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: "An unexpected error occurred"

  /v1/person/person-profile/{person_id}:
    get:
      tags:
        - Person
      summary: Get person profile.
      description: Returns the full profile of a given person, including personal details, qualifications, and their currently active ministry portfolio.
      operationId: getPersonProfile

      parameters:
        - name: person_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the person
          example: "per-123"

      responses:
        "200":
          description: Successfully returned person profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonProfileResponse"
              example:
                name: "Michael Carter"
                political_party: "Progressive Alliance"
                date_of_birth: "1974-02-11"
                religion: "Christianity"
                profession: "Lawyer"
                email: "m.carter@example.org"
                phone_number: "2025550147"
                education_qualifications: "LLB (Hons)"
                professional_qualifications: "Barrister-at-Law"
                image_URL: "data/people/images/michael-carter.jpg"
                age: 45

        "400":
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: "Person ID is required"

        "404":
          description: Person not found or profile data unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: "Person not found"

        "500":
          description: Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: "An unexpected error occurred"

  /v1/person/all-presidents:
    get:
      tags:
        - Person
      summary: Get all presidents.
      description: Returns a list of all presidents with their terms and gazettes published during those terms.
      operationId: getAllPresidents
      responses:
        "200":
          description: Successfully returned all presidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllPresidentsResponse"
              example:
                presidents:
                  - id: "pres-1"
                    name: "John Doe"
                    terms:
                      - start: "2010-01-01"
                        end: "2015-01-01"
                        gazettes_published:
                          - date: "2012-05-15"
                            ids: ["gzt-101", "gzt-102"]
                  - id: "pres-2"
                    name: "Jane Smith"
                    terms:
                      - start: "2015-01-01"
                        end: null
                        gazettes_published: []

        "500":
          description: Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: "An unexpected error occurred"
 
  /v1/ministry/{ministry_id}/persons:
    post:
      tags:
        - Person
      summary: Get persons assigned to a ministry on a given date.
      description: Returns the enriched list of persons appointed to a given ministry as of a specific date, along with precomputed summary counts and president/new-appointment flags.
      operationId: getPortfolioPerson

      parameters:
        - name: ministry_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the ministry
          example: "min-12"
       
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - date
              properties:
                date:
                  type: string
                  format: date-time
                  description: Date to query persons as-of
                  example: "2026-04-21T00:00:00Z"
                relation_name:
                  type: string
                  enum:
                    - AS_APPOINTED
                  default: AS_APPOINTED
                  description: Relation type filter

      responses:
        "200":
          description: Successfully returned ministry persons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryPersonsResponse"
              example:
                ministry_name: "Minister of Women and Child Affairs"
                total_count: 1
                new_count: 0
                theme_color_light: "#4A90E2"
                persons:
                  - id: "cit-16"
                    name: "Saroja Savithri Paulraj"
                    start_time: "2024-11-18T00:00:00Z"
                    end_time: null
                    is_new: false
                    is_president: false
                    profile_url: "/person-profile/cit-16"

        "400":
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: "ministry_id and date are required"

        "404":
          description: Ministry not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: "Ministry not found"

        "500":
          description: Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
              example:
                detail: "An unexpected error occurred"

components:
  schemas:
    MinistryHistoryItem:
      type: object
      required:
        - id
        - name
        - term
        - is_president
      properties:
        id:
          type: string
          description: "Unique ministry identifier"
          example: "min-456"
        name:
          type: string
          description: "Name of the ministry"
          example: "Ministry of Health"
        term:
          type: string
          description: "Formatted term string (e.g., '2020-01-01 - 2022-05-15')"
          example: "2020-01-01 - 2022-05-15"
        is_president:
          type: boolean
          description: "Whether the person was president during this ministry term"
          example: false

    PersonHistoryResponse:
      type: object
      required:
        - ministry_history
        - ministries_worked_at
        - worked_as_president
      properties:
        ministry_history:
          type: array
          description: "List of ministry assignments sorted by date"
          items:
            $ref: "#/components/schemas/MinistryHistoryItem"
        ministries_worked_at:
          type: integer
          description: "Total count of ministries the person has worked at"
          minimum: 0
          example: 2
        worked_as_president:
          type: integer
          description: "Total count of times the person has served as president"
          minimum: 0
          example: 1

    PersonProfileResponse:
      type: object
      required:
        - name
        - political_party
        - date_of_birth
        - religion
        - profession
        - email
        - phone_number
        - education_qualifications
        - professional_qualifications
        - image_URL
        - age
      properties:
        name:
          type: string
          description: "Full name of the person"
          examples: ["Michael Carter"]
        political_party:
          type: string
          description: "Political party the person is affiliated with"
          examples: ["Progressive Alliance"]
        date_of_birth:
          type: string
          format: date
          description: "Date of birth in YYYY-MM-DD format"
          examples: ["1974-02-11"]
        religion:
          type: string
          description: "Religion of the person"
          examples: ["Christianity"]
        profession:
          type: string
          description: "Profession of the person"
          examples: ["Lawyer"]
        email:
          type: string
          format: email
          description: "Official email address of the person"
          examples: ["m.carter@example.org"]
        phone_number:
          type: string
          description: "Contact phone number of the person"
          examples: ["2025550147"]
        education_qualifications:
          type: string
          description: "Educational qualifications of the person"
          examples: ["LLB (Hons)"]
        professional_qualifications:
          type: string
          description: "Professional qualifications of the person"
          examples: ["Barrister-at-Law"]
        image_URL:
          type: string
          description: "Path or URL to the profile image of the person"
          examples: ["data/people/images/michael-carter.jpg"]
        age:
          type: integer
          description: "The person's age"
          examples: [45]

    AllPresidentsResponse:
      type: object
      required:
        - presidents
      properties:
        presidents:
          type: array
          description: "List of all presidents sorted by their latest term date"
          items:
            $ref: "#/components/schemas/PresidentInfo"

    PresidentInfo:
      type: object
      required:
        - id
        - name
        - terms
      properties:
        id:
          type: string
          description: "Unique president identifier"
          example: "pres-1"
        name:
          type: string
          description: "Full name of the president"
          example: "John Doe"
        terms:
          type: array
          description: "List of presidential terms, sorted by latest term first"
          items:
            $ref: "#/components/schemas/PresidentTerm"

    PresidentTerm:
      type: object
      required:
        - start
        - end
        - gazettes_published
      properties:
        start:
          type: string
          format: date
          description: "Term start date (YYYY-MM-DD)"
          example: "2010-01-01"
        end:
          type: string
          format: date
          nullable: true
          description: "Term end date (YYYY-MM-DD), null if ongoing"
          examples: ["2015-01-01", null]
        gazettes_published:
          type: array
          items:
            $ref: "#/components/schemas/GazettePublished"

    GazettePublished:
      type: object
      required:
        - date
        - ids
      properties:
        date:
          type: string
          format: date
          description: "Date the gazettes were published"
          examples: ["2012-05-15"]
        ids:
          type: array
          items:
            type: string
          description: "List of gazette IDs published on this date"
          example: ["gzt-101", "gzt-102"]
 
    MinistryPersonsResponse:
      type: object
      required:
        - ministry_name
        - total_count
        - new_count
        - theme_color_light
        - persons
      properties:
        ministry_name:
          type: string
          description: "Human-readable name of the queried ministry"
          example: "Minister of Women and Child Affairs"
        total_count:
          type: integer
          minimum: 0
          description: "Total number of persons — powers 'Total People' in Key Highlights"
          example: 1
        new_count:
          type: integer
          minimum: 0
          description: "Count of persons where is_new is true — powers 'New People' in Key Highlights"
          example: 0
        theme_color_light:
          type: string
          description: "Hex color for the currently selected president, used for badges/icons/links"
          example: "#4A90E2"
        persons:
          type: array
          items:
            $ref: "#/components/schemas/MinistryPersonSummary"

    MinistryPersonSummary:
      type: object
      required:
        - id
        - name
        - start_time
        - end_time
        - is_new
        - is_president
        - profile_url
      properties:
        id:
          type: string
          description: "Person ID"
          example: "cit-16"
        name:
          type: string
          description: "Fully resolved, human-readable name (decoded server-side)"
          example: "Saroja Savithri Paulraj"
        start_time:
          type: string
          format: date-time
          description: "When this person's appointment relation started"
          example: "2024-11-18T00:00:00Z"
        end_time:
          type: [string, "null"]
          format: date-time
          description: "When the relation ended; null if still active"
          example: null
        is_new:
          type: boolean
          description: "True if start_time falls on the queried date"
          example: false
        is_president:
          type: boolean
          description: "True if this person is the currently selected president"
          example: false
        profile_url:
          type: string
          description: "Relative path to this person's profile page"
          example: "/person-profile/cit-16"