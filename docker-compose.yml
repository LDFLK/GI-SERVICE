version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: gi-redis
    ports:
      - "127.0.0.1:6379:6379"
    # Shared store for both uvicorn workers (and later multiple replicas)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gi-service:
    build: .
    container_name: gi-service
    ports:
      - "8000:8000" # host:container
    env_file:
      - .env # load environment variables
    environment:
      # Hostname `redis` is the compose service name (not localhost)
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: "true"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2 --timeout-keep-alive 75 --backlog 2048

  tests:
    build: .
    container_name: gi-tests
    env_file:
      - .env
    environment:
      CACHE_ENABLED: "false"
    volumes:
      - .:/app
    depends_on:
      - gi-service
    command: pytest --maxfail=1 --disable-warnings -q
